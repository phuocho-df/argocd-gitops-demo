# kind cluster for the GitOps demo: one node running inside Docker.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-demo
nodes:
  - role: control-plane
    # Pinned Kubernetes node image (the default of kind v0.33.0), so every laptop gets the same version.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # Forward laptop ports into the node so NodePort services open at http://localhost:<port>.
    extraPortMappings:
      - containerPort: 30080 # demo app (color-app Service)
        hostPort: 30080
      - containerPort: 30081 # ArgoCD web UI (argocd-server Service)
        hostPort: 30081
