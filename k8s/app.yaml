# The demo app. ArgoCD keeps the cluster identical to this file.
# Scenes edit only two lines: "replicas:" and "image:".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-app
spec:
  replicas: 10 # <-- scene 2: change to 10
  minReadySeconds: 10 # each new pod waits 10s before counting as ready, so the color change is gradual and visible
  progressDeadlineSeconds: 60 # a stuck rollout is reported as failed (ArgoCD "Degraded") after 60s
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never remove an old pod before its replacement is ready -> a bad image never causes downtime
      maxSurge: 25% # add up to 25% extra pods at a time during an update
  selector:
    matchLabels:
      app: color-app
  template:
    metadata:
      labels:
        app: color-app
    spec:
      containers:
        - name: color-app
          image: argoproj/rollouts-demo:yelow # <-- scene 1: change blue to yellow / scene 4: typo "yelow"
          imagePullPolicy: IfNotPresent # use the images preloaded into kind (no internet needed for them)
          ports:
            - containerPort: 8080
          readinessProbe: # only send traffic to a pod once it answers
            httpGet:
              path: /color
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# Exposes the pods on http://localhost:30080 (via kind-config.yaml port mapping).
# Every browser request is balanced across all pods, so you see a mix of colors during an update.
apiVersion: v1
kind: Service
metadata:
  name: color-app
spec:
  type: NodePort
  selector:
    app: color-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
